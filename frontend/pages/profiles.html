<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Directory</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
    }

    /* Gradient button style */
    .btn-gradient {
      background: linear-gradient(to right, #3b82f6, #6366f1, #a855f7);
      color: white;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.25s ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .btn-gradient:hover {
      transform: scale(1.05);
      filter: brightness(1.05);
    }

    /* Normal outline button */
    .btn-outline {
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .btn-outline:hover {
      background: #f3f4f6;
      transform: scale(1.02);
    }
  </style>
</head>

<body>

 

  <!-- Main Section -->
  <section class="max-w-6xl mx-auto px-4 py-14">

    <!-- Title + Back button -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-10">
      <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
        Patient Directory
      </h1>

      <a href="/" class="btn-gradient px-8 py-3 rounded-full">
     ← Back to Home
    </a>
    </div>

    <!-- Overlay box (controls area) -->
    <div class="w-full max-w-6xl mx-auto bg-white rounded-xl shadow-md p-5
                flex flex-wrap items-center justify-center gap-4 mb-10">

      <!-- Search -->
      <div class="flex items-center gap-2 border border-gray-300 rounded-xl px-4 py-2 bg-white">
        <span class="text-gray-600 text-lg">🔍</span>
        <input id="searchInput" type="text" placeholder="Search..."
               class="outline-none w-[200px] text-gray-700" />
      </div>

      <!-- Sort -->
      <select id="sortBy" class="border border-gray-300 rounded-xl px-4 py-2 bg-white font-semibold">
        <option value="id">Sort: Patient ID</option>
        <option value="name">Sort: Name</option>
        <option value="age">Sort: Age</option>
      </select>

      <!-- Order -->
      <select id="sortOrder" class="border border-gray-300 rounded-xl px-4 py-2 bg-white font-semibold">
        <option value="asc">Asc ↑</option>
        <option value="desc">Desc ↓</option>
      </select>

      <!-- Export CSV -->
      <button id="exportCsvBtn" class="btn-gradient min-w-[120px]">
        📄 CSV
      </button>

      <!-- Export PDF -->
      <button id="exportPdfBtn" class="btn-gradient min-w-[120px]">
        📑 PDF
      </button>

    </div>

    <!-- Table -->
    <div class="bg-white shadow-md rounded-xl p-6">
      <div class="overflow-x-auto">
        <table class="min-w-full border border-gray-400 text-center">
          <thead class="text-white">
  <tr class="bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500">
    <th class="border border-gray-300 px-6 py-4 font-bold">Patient ID</th>
    <th class="border border-gray-300 px-6 py-4 font-bold">Name</th>
    <th class="border border-gray-300 px-6 py-4 font-bold">Age</th>
    <th class="border border-gray-300 px-6 py-4 font-bold">Gender</th>
    <th class="border border-gray-300 px-6 py-4 font-bold">Phone</th>
    <th class="border border-gray-300 px-6 py-4 font-bold">View</th>
  </tr>
</thead>

          <!-- IMPORTANT: add this ID so JS can render rows -->
          <tbody id="profilesTableBody">
            <!-- dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>

  </section>

</body>
</html>
