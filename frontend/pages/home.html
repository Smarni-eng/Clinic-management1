<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
    position: relative;
    min-height: 100vh;
    background-image: url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* White transparent overlay */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.85); /* opacity control */
    z-index: 0;
  }

  /* Bring content above overlay */
  header,
  main {
    position: relative;
    z-index: 1;
  }
    
  </style>
</head>

<body>

  <!-- Header -->
  <header class="bg-blue-600 text-white py-5 shadow">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-4">
      <h1 class="text-2xl font-bold">Clinic Management</h1>
      <nav class="space-x-6">
        <a href="/" class="hover:underline">Home</a>
        <a href="/patients" class="hover:underline">Patients</a>
        <a href="/doctors" class="hover:underline">Doctors</a>
        <a href="/appointments" class="hover:underline">Appointments</a>
        <a href="/billings" class="hover:underline">Billings</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-12 text-center">
    <h2 class="text-3xl font-bold mb-3">Welcome</h2>
    <p class="text-gray-700 mb-10">
      Manage all clinic operations from one simple dashboard
    </p>

    <div class="grid grid-cols-1 sm:grid-cols2 lg:grid-cols-3 gap-6">

      <a href="/patients" class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-users text-4xl text-blue-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Patient Records</h3>
      </a>

      <a href="/api/patients" target="_blank"
         class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-code text-4xl text-gray-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Patient API</h3>
      </a>

      <a href="/doctors" class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-user-doctor text-4xl text-green-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Doctor Records</h3>
      </a>

      <a href="/api/doctors" target="_blank"
         class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-code text-4xl text-gray-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Doctor API</h3>
      </a>

      <a href="/appointments" class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-calendar-check text-4xl text-purple-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Appointments</h3>
      </a>

      <a href="/api/appointments" target="_blank"
        class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-code text-4xl text-gray-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Appointments API</h3>
      </a>

      <a href="/billings" class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-file-invoice-dollar text-4xl text-orange-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Billing Records</h3>
      </a>

      <a href="/api/billings" target="_blank"
         class="group bg-white/90 backdrop-blur p-6 rounded-2xl shadow-md hover:shadow-2xl hover:-translate-y-1 transition-all duration-300">
        <i class="fa-solid fa-code text-4xl text-gray-600 mb-4"></i>
        <h3 class="text-lg font-semibold">Billing API</h3>
      </a>

    </div>
  </main>

</body>
</html>
