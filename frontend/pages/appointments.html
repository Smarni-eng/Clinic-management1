<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  body {
    /* A vibrant, modern mesh gradient */
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); /* Fallback */
    background: 
        radial-gradient(at 0% 0%, rgba(165, 180, 252, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(249, 168, 212, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.5) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(196, 181, 253, 0.5) 0px, transparent 50%);
    background-color: #f3f4f6;
    background-attachment: fixed;
    margin: 0;
    min-height: 100vh;
  }

  /* Make the cards pop against the new background */
  .glass-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
</style>
</head>
<body class="min-h-screen
             bg-gradient-to-br
             from-blue-100
             via-pink-100
             to-purple-100">
                
  <section class="max-w-6xl mx-auto mb-10 mt-6 px-4">
  <div class="bg-gradient-to-r from-blue-100 via-cyan-100 to-purple-100
              border border-white/70
              rounded-3xl p-8 shadow-lg backdrop-blur-md">

    <h1 class="text-3xl font-bold text-gray-800 mb-1">
      Appointments
    </h1>

    <p class="text-gray-600">
      Manage appointment records and scheduling
    </p>

  </div>
</section>
    <a href="/home" data-link
   class="inline-flex items-center gap-1 px-6 py-2 text-sm font-semibold
          text-white rounded-full
          bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500
          hover:from-blue-600 hover:via-indigo-600 hover:to-purple-600
          transition-all duration-300 shadow-md hover:shadow-lg">
   ← Back to Home
    </a>

  </div>
                            
  <!-- Add / Edit Doctor Form -->
   <div class="max-w-6xl mx-auto px-4 mb-8">
  <div class="bg-gradient-to-br
            from-blue-50/70
            via-white/80
            to-pink-50/70
            backdrop-blur-lg
            p-8 rounded-3xl
            shadow-xl
            border border-white/60">
    <h2 class="font-semibold mb-3 text-lg">Add New Appointment</h2>
    <form id="appointmentForm" class="space-y-3">
      <input type="text" id="patient_id" placeholder="Patient_id" required class="w-full border rounded px-3 py-2">
      <input type="text" id="doctor_id" placeholder="Doctor_id" required class="w-full border rounded px-3 py-2">
      <input type="date" id="appointment_date" placeholder="Appointment Date" required class="w-full border rounded px-3 py-2">
      <input type="time" id="appointment_time" placeholder="Appointment Time" required class="w-full border rounded px-3 py-2">
      <input type="text" id="status" placeholder="Status (e.g., Scheduled, Completed)" required class="w-full border rounded px-3 py-2">

      <div class="flex space-x-2">
        <button type="submit" id="submitBtn"
          class="flex-1 py-2 rounded-full text-white font-semibold
           bg-gradient-to-r from-blue-500 to-purple-500
           hover:from-blue-600 hover:to-purple-600 transition shadow">
          Add Appointment
        </button>
                                                                                                                
        <button type="button" id="cancelBtn"
          class="flex-1 bg-gray-400 hover:bg-gray-500 text-white py-2 rounded hidden">
          Cancel
        </button>
      </div>
    </form>
  </div>
 </div>                                                                                                                                                               
  <!-- Appointments Table -->
  <div class="max-w-6xl mx-auto px-4">
  <div class="bg-white/80 backdrop-blur-md
              p-6 rounded-2xl shadow-lg border border-white/70">
    <h2 class="font-semibold mb-4 text-lg">All Appointments</h2>
                                                                                                                                                                        
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center py-4">
      <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-500 mx-auto"></div>
    </div>
                                                                                                                                                                                          
    <!-- Appointments Table Container -->
    <div id="appointmentsTableContainer" class="hidden overflow-x-auto">
      <table class="min-w-full text-left border">
        <thead class="bg-gradient-to-r from-blue-100 via-cyan-100 to-purple-100">
          <tr>
            <th class="px-3 py-2">ID</th>
            <th class="px-3 py-2">Patient ID</th>
            <th class="px-3 py-2">Doctor ID</th>
            <th class="px-3 py-2">Appointment Date</th>
            <th class="px-3 py-2">Appointment Time</th>
            <th class="px-3 py-2">Status</th>
            <th class="px-3 py-2">Actions</th>
          </tr>
        </thead>
        <tbody id="appointmentsTableBody" class="divide-y hover:[&_tr]:bg-blue-50 transition">
          </tbody>
      </table>
      <p id="noAppointments" class="text-center text-gray-500 mt-3 hidden">
        No appointments found. Add one using the form above.
      </p>
    </div>
  </div>

  <!-- Alert container -->
  <div id="alertContainer" class="fixed top-4 right-4 space-y-2 z-50"></div>
</body>
</html>
